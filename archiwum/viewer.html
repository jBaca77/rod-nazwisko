<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podgląd dokumentu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1e1a14; --sepia: #7a6548; --gold: #9b7d4a;
            --sepia-pale: #e8ddd0; --warm-white: #fdfaf6;
        }
        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--warm-white);
            color: var(--ink);
            padding: 30px 40px;
            line-height: 1.7;
            margin: 0;
        }
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--gold);
            border-bottom: 1px solid var(--sepia-pale);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        
        .text-content {
            font-size: 1.05rem;
            margin-bottom: 40px;
            white-space: pre-wrap;
            background: #fff;
            padding: 25px;
            border: 1px solid var(--sepia-pale);
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            color: #3d3628;
        }

        /* Siatka zdjęć */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            align-items: center;
        }
        .gallery img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border: 1px solid var(--sepia-pale);
            border-radius: 4px;
            background: #fff;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: zoom-in; /* Kursor zmienia się w LUPĘ po najechaniu */
        }
        .gallery img:hover {
            transform: scale(1.03); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .map-wrapper {
            margin-top: 30px;
            border: 1px solid var(--sepia-pale);
            padding: 15px;
            background: #fff;
            border-radius: 4px;
        }
        .map-wrapper h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            color: var(--ink);
        }
        .error { text-align: center; padding: 50px; color: var(--sepia); }

        /* ── LIGHTBOX (POWIĘKSZENIE ZDJĘCIA) ── */
        .lightbox {
            display: none; /* Domyślnie ukryte */
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 8, 6, 0.9); /* Ciemne tło */
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.show {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border: 2px solid var(--gold);
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            cursor: zoom-out;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: var(--warm-white);
            font-size: 50px;
            font-weight: 300;
            cursor: pointer;
            transition: 0.2s;
            font-family: sans-serif;
        }
        .lightbox-close:hover {
            color: var(--gold);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Tu JavaScript będzie wrzucał wygenerowaną treść -->
    <div id="documentContainer">
        <div style="text-align:center; padding: 50px; color: #b09a7e;">Wczytywanie dokumentu z archiwum...</div>
    </div>

    <!-- Struktura Lightboxa (ukryta na starcie) -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Powiększony dokument">
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const docId = params.get('id');
        const container = document.getElementById('documentContainer');

        // Elementy Lightboxa
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.lightbox-close');

        // Funkcje otwierania i zamykania powiększenia
        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.classList.add('show');
        }

        function closeLightbox() {
            lightbox.classList.remove('show');
            setTimeout(() => lightboxImg.src = "", 300); // Czyszczenie po zniknięciu
        }

        // Zamykanie kliknięciem w X lub w tło
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target !== lightboxImg) {
                closeLightbox();
            }
        });

        // Wczytywanie dokumentów
        if (!docId) {
            container.innerHTML = '<div class="error">Nie wybrano żadnego dokumentu. Wybierz pozycję z menu po lewej stronie.</div>';
        } else {
            fetch('dane_archiwum.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(dane => {
                    const dokument = dane[docId];

                    if (!dokument) {
                        container.innerHTML = `<div class="error">Dokument o sygnaturze <b>${docId}</b> nie został odnaleziony w bazie danych.</div>`;
                        return;
                    }

                    let html = `<h2>${dokument.title}</h2>`;

                    if (dokument.text && dokument.text.trim() !== "") {
                        html += `<div class="text-content">${dokument.text}</div>`;
                    }

                    if (dokument.images && dokument.images.length > 0) {
                        html += `<div class="gallery">`;
                        dokument.images.forEach(imgUrl => {
                            // Zwróć uwagę na usunięte tagi zamykające img i dodaną obsługę kliknięcia
                            html += `<img src="${imgUrl}" alt="Skan dokumentu" loading="lazy" onclick="openLightbox('${imgUrl}')">`;
                        });
                        html += `</div>`;
                    }

                    if (dokument.map_iframe && dokument.map_iframe.trim() !== "") {
                        html += `
                        <div class="map-wrapper">
                            <h3>Lokalizacja</h3>
                            ${dokument.map_iframe}
                        </div>`;
                    }

                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error("Błąd ładowania bazy:", error);
                    container.innerHTML = `<div class="error">Wystąpił problem z połączeniem z plikiem dane_archiwum.json.</div>`;
                });
        }
    </script>
</body>
</html>
