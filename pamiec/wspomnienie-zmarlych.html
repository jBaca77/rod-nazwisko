<script>
        // Sprawdzenie czy baza danych się załadowała
        if (typeof osoby === 'undefined') {
            console.error("BŁĄD: Plik wspomnienia.js nie został załadowany!");
        }

        const slider = document.getElementById('rokSlider');
        const display = document.getElementById('wyswietlanyRok');
        const lista = document.getElementById('listaOsob');

        function renderuj(startRok) {
            const endRok = startRok + 5;
            display.innerText = `Okres: ${startRok} - ${endRok}`;
            
            // Używamy "rokZgonu", bo tak masz w pliku JS
            const przefiltrowani = osoby.filter(osoba => osoba.rokZgonu >= startRok && osoba.rokZgonu <= endRok);
            
            if (przefiltrowani.length === 0) {
                lista.innerHTML = "<p>Brak danych dla tego okresu.</p>";
            } else {
                lista.innerHTML = przefiltrowani.map(osoba => `
                    <div class="karta">
                        <div class="foto" style="background-image: url('zdjecia/pamiec/zdjecia/${osoba.foto}')"></div>
                        <p><strong>${osoba.imie}</strong><br>${osoba.lata}</p>
                    </div>
                `).join('');
            }
        }

        slider.addEventListener('input', (e) => {
            renderuj(parseInt(e.target.value));
        });

        // Startowe wyświetlenie
        renderuj(1975);
    </script>
