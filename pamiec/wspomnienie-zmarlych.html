<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oś Czasu Pamięci | Archiwum L&K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- TUTAJ ŁADUJESZ SWÓJ PLIK JS Z BAZĄ DANYCH -->
    <script src="sciezka/do/wspomnienia.js"></script>

    <style>
        :root {
            --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6;
            --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548;
            --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a;
            --gold-light: #c8a96e; --green-dark: #2c3e2d; --line: rgba(122, 101, 72, 0.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Jost', sans-serif; font-weight: 300; background-color: var(--warm-white); color: var(--ink); line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        /* ── NAWIGACJA (jak w kodzie 3 - bez paska bocznego) ── */
        nav { background-color: var(--ink); padding: 16px 24px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,.4); }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); text-decoration: none; font-size: 1.2rem; letter-spacing: 2px; }
        .back-link { color: var(--cream); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .back-link:hover { color: var(--gold-light); }

        /* ── HEADER ── */
        header { background-color: var(--green-dark); color: var(--cream); text-align: center; padding: 120px 24px 100px; position: relative; overflow: hidden; }
        header::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,.025) 40px, rgba(255,255,255,.025) 41px), repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,.025) 40px, rgba(255,255,255,.025) 41px); pointer-events: none; }
        .header-ornament { font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: .4em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 25px; display: block; position: relative; z-index: 1; }
        header h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: 1; margin-bottom: 15px; position: relative; z-index: 1; }
        .header-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; color: rgba(248,244,238,.7); max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }

        /* ── MAIN CONTENT ── */
        main { max-width: 1100px; margin: 0 auto; padding: 80px 24px 120px; }
        .s-label { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: var(--sepia-light); margin-bottom: 12px; display: block; text-align: center; }
        .s-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 10px; color: var(--ink); font-weight: 400; text-align: center; }
        .s-line { width: 50px; height: 1.5px; background: var(--gold); margin: 0 auto 45px; }

        /* ── PANEL SUWAKA (SLIDER) ── */
        .slider-panel {
            max-width: 700px;
            margin: 0 auto 50px;
            padding: 40px;
            background: var(--parchment);
            border: 1px dashed var(--sepia-light);
            text-align: center;
            border-radius: 2px;
        }
        
        #wyswietlanyRok {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--ink);
            display: block;
            margin-bottom: 25px;
        }

        /* Stylowy input range */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: var(--sepia-pale); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { height: 22px; width: 22px; border-radius: 50%; background: var(--gold); cursor: pointer; -webkit-appearance: none; margin-top: -9px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: 0.2s; }
        input[type=range]::-webkit-slider-thumb:hover { background: var(--ink); transform: scale(1.1); }
        input[type=range]::-moz-range-track { width: 100%; height: 4px; cursor: pointer; background: var(--sepia-pale); border-radius: 2px; }
        input[type=range]::-moz-range-thumb { height: 22px; width: 22px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }

        /* ── KARTY OSÓB ── */
        #listaOsob {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .osoba-karta {
            background: var(--cream); padding: 40px 20px; border: 1px solid var(--sepia-pale);
            text-align: center; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative; display: flex; flex-direction: column; align-items: center;
        }

        .osoba-karta::after {
            content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); pointer-events: none; transition: 0.4s;
        }

        .osoba-karta:hover {
            transform: translateY(-8px); background-color: #fff; border-color: var(--gold); box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        .osoba-karta:hover::after { border-color: var(--gold-light); inset: 15px; }

        .osoba-foto-ramka {
            width: 130px; height: 130px; border-radius: 50%; border: 1px solid var(--line); padding: 6px;
            background: white; margin-bottom: 20px; position: relative; z-index: 1; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .osoba-foto {
            width: 100%; height: 100%; border-radius: 50%; background-size: cover; background-position: center;
            filter: grayscale(40%) sepia(20%); transition: all 0.5s ease;
        }

        .osoba-karta:hover .osoba-foto { filter: grayscale(0%) sepia(0%); transform: scale(1.08); }

        .osoba-info { position: relative; z-index: 1; }
        .osoba-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 5px; font-weight: 500; line-height: 1.1; }
        .osoba-info .lata { font-family: 'Jost', sans-serif; font-size: 0.8rem; color: var(--sepia); text-transform: uppercase; letter-spacing: 3px; font-weight: 400; margin-top: 5px; }

        .brak-danych { grid-column: 1 / -1; text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--sepia-light); font-style: italic; padding: 60px 20px; }

        footer { background: var(--ink); color: rgba(248,244,238,0.4); text-align: center; padding: 60px 24px; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <!-- Odnośnik powrotu do strony głównej -->
        <a href="../index.html" class="nav-logo">ARCHIWUM L&K</a>
        <!-- Odnośnik powrotu do podstrony Pamięć -->
        <a href="pamiec.html" class="back-link">← Powrót do pamięci</a>
    </div>
</nav>

<header>
    <span class="header-ornament">Oś Czasu Pamięci</span>
    <h1>Wspomnienie Zmarłych</h1>
    <p class="header-quote">„Umarłych wieczność dotąd trwa, dokąd pamięcią im się płaci.”</p>
</header>

<main>
    <span class="s-label">Filtrowanie</span>
    <h2 class="s-title">Wyszukaj według lat</h2>
    <div class="s-line"></div>

    <div class="slider-panel">
        <span id="wyswietlanyRok">Okres: 1975 - 1980</span>
        <!-- Atrybuty suwaka -->
        <input type="range" id="rokSlider" min="1970" max="2025" step="5" value="1975">
    </div>

    <div id="listaOsob">
        <!-- Karty będą renderowane tutaj przez JavaScript -->
    </div>
</main>

<footer>
    <p>KLAN ŁADOMIRSKICH I KRAIŃSKICH © 1975 – 2026</p>
</footer>

<script>
    // Sprawdzenie czy baza danych się załadowała
    if (typeof osoby === 'undefined') {
        console.error("BŁĄD: Plik wspomnienia.js nie został załadowany!");
    }

    const slider = document.getElementById('rokSlider');
    const display = document.getElementById('wyswietlanyRok');
    const lista = document.getElementById('listaOsob');

    function renderuj(startRok) {
        const endRok = startRok + 5;
        display.innerText = `Okres: ${startRok} - ${endRok}`;
        
        // Upewniamy się, że tablica 'osoby' istnieje przed filtrowaniem
        if (typeof osoby !== 'undefined') {
            // Używamy "rokZgonu", bo tak masz w pliku JS
            const przefiltrowani = osoby.filter(osoba => osoba.rokZgonu >= startRok && osoba.rokZgonu <= endRok);
            
            if (przefiltrowani.length === 0) {
                lista.innerHTML = "<p class='brak-danych'>Brak danych dla tego okresu.</p>";
            } else {
                lista.innerHTML = przefiltrowani.map(osoba => `
                    <div class="osoba-karta">
                        <div class="osoba-foto-ramka">
                            <div class="osoba-foto" style="background-image: url('zdjecia/pamiec/zdjecia/${osoba.foto}')"></div>
                        </div>
                        <div class="osoba-info">
                            <h3>${osoba.imie}</h3>
                            <p class="lata">${osoba.lata}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
    }

    if(slider) {
        slider.addEventListener('input', (e) => {
            renderuj(parseInt(e.target.value));
        });
    }

    // Startowe wyświetlenie
    renderuj(1975);
</script>
</body>
</html>
