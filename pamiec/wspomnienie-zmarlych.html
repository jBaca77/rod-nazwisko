<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oś Czasu Pamięci | Archiwum L&K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- TUTAJ ŁADUJESZ SWÓJ PLIK JS Z BAZĄ DANYCH -->
    <script src="wspomnienia.js"></script>

    <style>
        :root {
            --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6;
            --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548;
            --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a;
            --gold-light: #c8a96e; --green-dark: #2c3e2d; --line: rgba(122, 101, 72, 0.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Jost', sans-serif; font-weight: 300; background-color: var(--warm-white); color: var(--ink); line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        /* ── NAWIGACJA ── */
        nav { background-color: var(--ink); padding: 16px 24px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,.4); }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); text-decoration: none; font-size: 1.2rem; letter-spacing: 2px; }
        .back-link { color: var(--cream); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .back-link:hover { color: var(--gold-light); }

        /* ── MAIN CONTENT ── */
        main { max-width: 1100px; margin: 0 auto; padding: 60px 24px 120px; }
        
        /* ── WPROWADZENIE ── */
        .intro-section { text-align: center; margin-bottom: 70px; }
        .s-label { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: var(--sepia-light); margin-bottom: 12px; display: block; text-align: center; }
        .s-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 15px; color: var(--ink); font-weight: 400; text-align: center; line-height: 1.1; }
        .s-line { width: 50px; height: 1.5px; background: var(--gold); margin: 0 auto 25px; }
        .intro-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; color: var(--sepia); max-width: 600px; margin: 0 auto; }

        /* ── KONTENER SUWAKA ── */
        .slider-wrapper {
            max-width: 700px;
            margin: 0 auto 60px;
            text-align: center;
            padding: 0 10px;
        }
        
        .slider-wrapper .s-title { font-size: 2rem; margin-bottom: 15px; }
        .slider-wrapper .s-line { margin-bottom: 35px; }

        /* Nawigacja Rokiem (strzałki + tekst) */
        .rok-display-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        .arrow-btn {
            background: none; border: none; font-size: 2.5rem; color: var(--sepia-light); 
            cursor: pointer; transition: color 0.3s, transform 0.2s; 
            padding: 0 15px; font-family: 'Jost', sans-serif; font-weight: 300;
            line-height: 1; display: flex; align-items: center; justify-content: center;
        }
        
        .arrow-btn:hover { color: var(--gold); transform: scale(1.15); }
        .arrow-btn:active { transform: scale(0.95); }

        #wyswietlanyRok {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--ink);
            display: block;
            font-weight: 500;
            min-width: 280px; /* Zabezpiecza przed skakaniem szerokości layoutu */
        }

        /* Oś czasu z suwakiem i podziałkami */
        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .range-label {
            font-size: 0.85rem;
            color: var(--sepia-light);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Stylowy input range */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; }
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: var(--sepia-pale); border-radius: 4px; transition: 0.3s; }
        input[type=range]::-webkit-slider-thumb { height: 26px; width: 26px; border-radius: 50%; background: var(--gold); cursor: grab; -webkit-appearance: none; margin-top: -10px; box-shadow: 0 4px 12px rgba(155, 125, 74, 0.3); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.25s; }
        input[type=range]::-webkit-slider-thumb:hover { background: var(--ink); transform: scale(1.15); }
        input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.05); }

        input[type=range]::-moz-range-track { width: 100%; height: 6px; cursor: pointer; background: var(--sepia-pale); border-radius: 4px; transition: 0.3s; }
        input[type=range]::-moz-range-thumb { height: 26px; width: 26px; border-radius: 50%; background: var(--gold); cursor: grab; border: none; box-shadow: 0 4px 12px rgba(155, 125, 74, 0.3); transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.25s; }
        input[type=range]::-moz-range-thumb:hover { background: var(--ink); transform: scale(1.15); }
        input[type=range]::-moz-range-thumb:active { cursor: grabbing; transform: scale(1.05); }

        /* ── KARTY OSÓB ── */
        #listaOsob {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        /* Efekt Fade-In dla kart */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .osoba-karta {
            background: var(--cream); padding: 40px 20px; border: 1px solid var(--sepia-pale);
            text-align: center; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative; display: flex; flex-direction: column; align-items: center;
            opacity: 0; /* Stan wyjściowy animacji */
            animation: fadeUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        .osoba-karta::after {
            content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); pointer-events: none; transition: 0.4s;
        }

        .osoba-karta:hover {
            transform: translateY(-8px) !important; /* Nadpisuje transform z fadeUp */
            background-color: #fff; border-color: var(--gold); box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        .osoba-karta:hover::after { border-color: var(--gold-light); inset: 15px; }

        .osoba-foto-ramka {
            width: 130px; height: 130px; border-radius: 50%; border: 1px solid var(--line); padding: 6px;
            background: white; margin-bottom: 20px; position: relative; z-index: 1; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .osoba-foto {
            width: 100%; height: 100%; border-radius: 50%; background-size: cover; background-position: center;
            filter: grayscale(40%) sepia(20%); transition: all 0.5s ease;
        }

        .osoba-karta:hover .osoba-foto { filter: grayscale(0%) sepia(0%); transform: scale(1.08); }

        .osoba-info { position: relative; z-index: 1; }
        .osoba-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 5px; font-weight: 500; line-height: 1.1; }
        .osoba-info .lata { font-family: 'Jost', sans-serif; font-size: 0.8rem; color: var(--sepia); text-transform: uppercase; letter-spacing: 3px; font-weight: 400; margin-top: 5px; }

        .brak-danych { 
            grid-column: 1 / -1; text-align: center; font-family: 'Cormorant Garamond', serif; 
            font-size: 1.4rem; color: var(--sepia-light); font-style: italic; padding: 60px 20px;
            animation: fadeUp 0.6s ease forwards;
        }

        footer { background: var(--ink); color: rgba(248,244,238,0.4); text-align: center; padding: 60px 24px; font-size: 0.8rem; letter-spacing: 2px; }

        /* RWD */
        @media (max-width: 768px) {
            #wyswietlanyRok { font-size: 1.8rem; min-width: 230px; }
            .arrow-btn { font-size: 2rem; padding: 0 10px; }
            .range-wrapper { gap: 10px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="../index.html" class="nav-logo">ARCHIWUM L&K</a>
        <a href="pamiec.html" class="back-link">← Powrót</a>
    </div>
</nav>

<main>
    <div class="intro-section">
        <span class="s-label">Oś Czasu Pamięci</span>
        <h1 class="s-title">Wspomnienie Zmarłych</h1>
        <div class="s-line"></div>
        <p class="intro-quote">„Umarłych wieczność dotąd trwa, dokąd pamięcią im się płaci.”</p>
    </div>

    <div class="slider-wrapper">
        <span class="s-label">Filtrowanie</span>
        <h2 class="s-title">Wyszukaj według lat</h2>
        <div class="s-line"></div>

        <div class="rok-display-wrapper">
            <!-- Strzałka w lewo -->
            <button id="btnPrev" class="arrow-btn" aria-label="Poprzedni rok">&#8249;</button>
            <span id="wyswietlanyRok">Okres: 1975 - 1980</span>
            <!-- Strzałka w prawo -->
            <button id="btnNext" class="arrow-btn" aria-label="Następny rok">&#8250;</button>
        </div>

        <div class="range-wrapper">
            <!-- Etykieta początkowa -->
            <span class="range-label">1970</span>
            <!-- Główny suwak -->
            <input type="range" id="rokSlider" min="1970" max="2025" step="1" value="1975">
            <!-- Etykieta końcowa -->
            <span class="range-label">2025</span>
        </div>
    </div>

    <div id="listaOsob">
        <!-- Karty będą renderowane tutaj przez JavaScript -->
    </div>
</main>

<footer>
    <p>KLAN ŁADOMIRSKICH I KRAIŃSKICH © 1975 – 2026</p>
</footer>

<script>
    if (typeof osoby === 'undefined') {
        console.error("BŁĄD: Plik wspomnienia.js nie został załadowany!");
    }

    const slider = document.getElementById('rokSlider');
    const display = document.getElementById('wyswietlanyRok');
    const lista = document.getElementById('listaOsob');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    function renderuj(startRok) {
        const endRok = startRok + 5;
        display.innerText = `Okres: ${startRok} - ${endRok}`;
        
        if (typeof osoby !== 'undefined') {
            const przefiltrowani = osoby.filter(osoba => osoba.rokZgonu >= startRok && osoba.rokZgonu <= endRok);
            
            if (przefiltrowani.length === 0) {
                lista.innerHTML = "<p class='brak-danych'>Brak danych dla tego okresu.</p>";
            } else {
                // Dodano style="animation-delay..." do stworzenia kaskadowego Fade-In
                lista.innerHTML = przefiltrowani.map((osoba, index) => `
                    <div class="osoba-karta" style="animation-delay: ${index * 0.08}s;">
                        <div class="osoba-foto-ramka">
                            <div class="osoba-foto" style="background-image: url('zdjecia/pamiec/zdjecia/${osoba.foto}')"></div>
                        </div>
                        <div class="osoba-info">
                            <h3>${osoba.imie}</h3>
                            <p class="lata">${osoba.lata}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
    }

    // Obsługa suwaka dotykowego/myszką
    if(slider) {
        slider.addEventListener('input', (e) => {
            renderuj(parseInt(e.target.value));
        });
    }

    // Obsługa strzałek do nawigacji po jednym roku
    if(btnPrev && btnNext && slider) {
        btnPrev.addEventListener('click', () => {
            let aktualnaWartosc = parseInt(slider.value);
            let minWartosc = parseInt(slider.min);
            if(aktualnaWartosc > minWartosc) {
                slider.value = aktualnaWartosc - 1;
                renderuj(aktualnaWartosc - 1);
            }
        });

        btnNext.addEventListener('click', () => {
            let aktualnaWartosc = parseInt(slider.value);
            let maxWartosc = parseInt(slider.max);
            if(aktualnaWartosc < maxWartosc) {
                slider.value = aktualnaWartosc + 1;
                renderuj(aktualnaWartosc + 1);
            }
        });
    }

    // Startowe uruchomienie
    renderuj(1975);
</script>
</body>
</html>
