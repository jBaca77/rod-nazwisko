<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6; 
    --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548; 
    --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a; 
    --gold-light: #c8a96e; --green-dark: #2c3e2d; --line: rgba(122, 101, 72, 0.2); 
  } 

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } 
  html { scroll-behavior: smooth; } 
  body { font-family: 'Jost', sans-serif; font-weight: 300; background-color: var(--warm-white); color: var(--ink); line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased; } 

  nav { background-color: var(--ink); position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,.4); } 
  .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; } 
  .nav-logo { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 400; } 
  .btn-back { font-family: 'Jost', sans-serif; color: var(--gold-light); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
  .btn-back:hover { color: var(--cream); }

  main { max-width: 1200px; margin: 0 auto; padding: 60px 24px 100px; } 
  .s-label { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: var(--sepia-light); margin-bottom: 12px; display: block; text-align: center; } 
  .s-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 6vw, 3.5rem); margin-bottom: 10px; color: var(--ink); text-align: center; font-weight: 300; line-height: 1.1; } 
  .s-line { width: 50px; height: 1.5px; background: var(--gold); margin: 0 auto 45px; } 

  /* Layout Mapy i Sidebar */
  .map-layout { display: flex; gap: 30px; align-items: flex-start; }
  .map-column { flex: 3; min-width: 0; }
  .sidebar-column { flex: 1; height: 550px; overflow-y: auto; background: var(--parchment); padding: 10px; border: 1px solid var(--sepia-pale); }
  .sidebar-column::-webkit-scrollbar { width: 4px; }
  .sidebar-column::-webkit-scrollbar-thumb { background: var(--sepia); border-radius: 2px; }

  #map { 
    height: 550px; width: 100%; border: 1px solid var(--sepia-pale); border-radius: 2px; margin-bottom: 20px; 
    filter: sepia(10%) contrast(98%) brightness(98%); 
    box-shadow: 0 15px 45px rgba(0,0,0,0.05); 
    z-index: 1; 
  } 

  .geo-grid { display: grid; grid-template-columns: 1fr; gap: 8px; } 
  .geo-box { 
    background: #fff; border: 1px solid var(--sepia-pale); padding: 6px 10px; 
    position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px;
    transition: all 0.3s;
  } 
  .geo-box:hover { border-color: var(--gold); transform: translateX(5px); } 

  .ribbon { 
    position: absolute; top: 0; right: 15px; width: 14px; height: 28px; 
    background: var(--gold); z-index: 2; 
  } 
  .ribbon::after { 
    content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 0; 
    border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 5px solid #fff; 
  }

  .box-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 0.9rem; color: var(--ink); padding-right: 25px; line-height: 1.2; } 
  .box-rod { font-family: 'Jost', sans-serif; font-size: 0.55rem; color: var(--sepia); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; margin-top: 4px; } 
  .box-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); } 
  .btn-locate { font-size: 0.6rem; color: var(--sepia); cursor: pointer; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; transition: 0.3s; } 
  .btn-locate:hover { color: var(--gold); } 
  .btn-more { font-size: 0.6rem; background: var(--ink); color: var(--cream); padding: 3px 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; border-radius: 1px; transition: 0.3s; } 
  .btn-more:hover { background: var(--gold); } 

  footer { background: var(--ink); color: rgba(248,244,238,0.4); text-align: center; padding: 80px 24px; font-size: 0.85rem; letter-spacing: 1px; margin-top: 80px; } 

  @media (max-width: 900px) { 
    main { padding: 40px 24px 60px; } 
    .map-layout { flex-direction: column; } 
    .map-column { width: 100%; }
    .sidebar-column { height: 400px; width: 100%; }
    #map { height: 400px; } 
  } 
</style>

  const initialCenter = [52.0, 19.0];
  const initialZoom = window.innerWidth <= 900 ? 5 : 6;
  
  // ZBALANSOWANA KONFIGURACJA MAPY (Gładzik + Kółko Myszy)
  const map = L.map('map', { 
    center: initialCenter, 
    zoom: initialZoom,
    zoomSnap: 0.25,          // Wypośrodkowanie: płynniejsze dla gładzika, ale wciąż stabilne dla myszki
    zoomDelta: 0.5,          // Zmniejsza domyślny skok przy nawigacji z przycisków
    wheelPxPerZoomLevel: 60  // Powrót do domyślnego mnożnika, aby usunąć brak responsywności
  }); 
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map); 

  const markerMap = {}; 
  const grid = document.getElementById('geoGrid'); 

  map.on('popupclose', function() {
    map.flyTo(initialCenter, initialZoom, { duration: 1.0 });
  });

  function init() { 
    gData.forEach(g => { 
      const marker = L.circleMarker(g.c, { 
        radius: 8, fillColor: "#9b7d4a", color: "#fff", weight: 2, fillOpacity: 0.9 
      }).addTo(map).bindPopup(`<strong>${g.p}</strong><br>${g.l}`); 
        
      markerMap[g.id] = marker; 

      grid.innerHTML += ` 
        <div class="geo-box"> 
          <div class="ribbon"></div> 
          <div class="box-title" title="${g.p}">${g.p}</div> 
          <div class="box-rod">${g.l}</div>
          <div class="box-actions"> 
            <span class="btn-locate" onclick="highlightMarker(${g.id})">Namierz</span> 
            <a href="grob${g.id}.html" class="btn-more">Więcej</a> 
          </div> 
        </div>`; 
    }); 

    setTimeout(() => { map.invalidateSize(); }, 300);
  } 

  function highlightMarker(id) { 
    const m = markerMap[id]; 
    if (!m) return; 
    map.flyTo(m.getLatLng(), 14, { duration: 1.0 }); 
    m.openPopup(); 
    
    // Przewijanie do mapy na urządzeniach mobilnych
    if (window.innerWidth <= 900) {
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } 

  window.addEventListener('resize', () => { 
    map.invalidateSize(); 
  });

  window.addEventListener('load', () => {
    map.invalidateSize();
  });

  init();
