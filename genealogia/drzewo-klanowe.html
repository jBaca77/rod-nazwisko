<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drzewo Klanowe | Archiwum L&K</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6;
            --ink: #1e1a14; --sepia: #7a6548; --gold: #9b7d4a; 
            --gold-light: #c8a96e; --line: #b09a7e;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Jost', sans-serif; background-color: var(--warm-white); color: var(--ink); line-height: 1.5; }

        nav { background-color: var(--ink); padding: 15px 24px; color: var(--gold-light); font-family: 'Cormorant Garamond', serif; letter-spacing: 2px; }
        main { padding: 40px 20px; }

        .tree-viewport {
            width: 100%; height: 80vh;
            background: var(--cream);
            overflow: auto;
            border: 1px solid var(--sepia);
            padding: 50px;
            display: flex;
            align-items: center;
        }

        /* STRUKTURA DRZEWA */
        .css-tree ul {
            display: flex;
            flex-direction: column;
            list-style: none;
            padding-left: 30px;
        }
        .css-tree li {
            display: flex;
            align-items: center;
            margin: 10px 0;
            position: relative;
        }
        /* Poziome linie do osoby */
        .css-tree li::before {
            content: ''; position: absolute; left: -30px; top: 50%;
            width: 30px; height: 1px; background: var(--line);
        }
        /* Pionowa linia łącząca rodzeństwo */
        .css-tree ul::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 1px; background: var(--line);
        }
        /* Pierwsza i ostatnia linia dziecka */
        .css-tree li:first-child { margin-top: 0; }
        .css-tree li:last-child { margin-bottom: 0; }

        .node {
            background: var(--warm-white);
            border: 1px solid var(--sepia);
            border-left: 4px solid var(--gold);
            padding: 12px 15px;
            min-width: 200px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }
        .node strong { display: block; color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
        .node .dates { font-size: 0.75rem; color: var(--ink-light); }
        .node .marriage { font-size: 0.75rem; color: var(--sepia); border-top: 1px solid #eee; margin-top: 5px; padding-top: 5px; }

        @media (max-width: 768px) {
            .tree-viewport { padding: 10px; }
            .node { min-width: 150px; }
        }
    </style>
</head>
<body>

<nav>ARCHIWUM L&K</nav>

<main>
    <h1 style="text-align:center; font-family: 'Cormorant Garamond', serif; margin-bottom: 30px;">Drzewo Klanowe</h1>
    
    <div class="tree-viewport" id="treeViewport">
        <div class="css-tree" id="tree-render-area">
            Wczytywanie danych...
        </div>
    </div>
</main>

<script>
    function generateNodeHTML(person) {
        let html = `<li><div class="node">`;
        html += `<strong>${person.name}</strong>`;
        if (person.dates) html += `<span class="dates">${person.dates}</span>`;
        if (person.marriage) html += `<span class="marriage">⚭ ${person.marriage}</span>`;
        html += `</div>`;
        
        if (person.children && person.children.length > 0) {
            html += `<ul>`;
            person.children.forEach(child => html += generateNodeHTML(child));
            html += `</ul>`;
        }
        html += `</li>`;
        return html;
    }

    async function loadTreeData() {
        const container = document.getElementById('tree-render-area');
        try {
            const response = await fetch('drzewo.json?t=' + Date.now());
            if (!response.ok) throw new Error('Brak danych');
            const data = await response.json();
            const rootData = Array.isArray(data) ? data[0] : data;
            
            container.innerHTML = `<ul>${generateNodeHTML(rootData)}</ul>`;
        } catch (err) {
            container.innerHTML = "Błąd wczytywania.";
            console.error(err);
        }
    }

    window.onload = loadTreeData;
</script>

</body>
</html>
