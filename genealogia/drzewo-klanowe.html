<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Drzewo Klanowe | Archiwum L&K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6;
            --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548; 
            --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a; 
            --gold-light: #c8a96e; --line: rgba(122, 101, 72, 0.3);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Jost', sans-serif; font-weight: 300; background-color: var(--warm-white); color: var(--ink); line-height: 1.7; overflow-x: hidden; }

        /* ── NAV ── */
        nav { background-color: var(--ink); position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
        .nav-logo { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); text-decoration: none; font-size: 1.2rem; letter-spacing: 2px; font-weight: 400; }
        
        /* ── MAIN ── */
        main { max-width: 1200px; margin: 0 auto; padding: 60px 24px; }
        .intro-section { text-align: center; margin-bottom: 40px; }
        .s-label { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: var(--sepia-light); display: block; margin-bottom: 15px; }
        .intro-section h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 300; margin-bottom: 25px; color: var(--ink); }
        .s-line { width: 60px; height: 1px; background: var(--gold-light); margin: 30px auto; opacity: 0.6; }

        /* ── DRZEWO (POZIOME) ── */
        .tree-viewport {
            width: 100%; height: 75vh;
            background: var(--cream); border: 1px solid var(--sepia-pale);
            border-radius: 4px; overflow: auto;
            position: relative; cursor: grab;
            padding: 40px;
        }
        /* Stylizacja scrollbara */
        .tree-viewport::-webkit-scrollbar { height: 8px; width: 8px; }
        .tree-viewport::-webkit-scrollbar-track { background: var(--parchment); }
        .tree-viewport::-webkit-scrollbar-thumb { background: var(--gold-light); border-radius: 4px; }

        .css-tree { display: flex; align-items: center; }
        .css-tree ul { display: flex; flex-direction: column; list-style-type: none; margin: 0; padding-left: 40px; }
        .css-tree li { display: flex; align-items: center; margin: 15px 0; position: relative; }
        
        /* Połączenia */
        .css-tree li::before {
            content: ''; position: absolute; top: 50%; left: -40px;
            width: 40px; height: 1px; background: var(--line);
        }
        .css-tree > li::before { display: none; } 

        .css-tree ul::before {
            content: ''; position: absolute; left: -40px; top: 0; bottom: 50%;
            width: 1px; background: var(--line);
        }
        .css-tree ul::after {
            content: ''; position: absolute; left: -40px; top: 50%; bottom: 0;
            width: 1px; background: var(--line);
        }
        .css-tree li:first-child ul::before { display: none; }
        .css-tree li:last-child ul::after { display: none; }
        .css-tree li:last-child::after { display: none; }

        .css-tree .node {
            background-color: var(--warm-white);
            border: 1px solid var(--sepia-pale);
            border-left: 4px solid var(--gold);
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-width: 220px;
            max-width: 280px;
            z-index: 10;
        }
        .node strong { display: block; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--gold); }
        .node .dates { font-size: 0.75rem; color: var(--sepia); font-style: italic; }
        .node .marriage { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--sepia-pale); font-size: 0.75rem; display: block; }
        .css-tree .root-node { border-left-width: 6px; border-color: var(--ink); background: var(--parchment); }

        /* ── KONTROLKI ── */
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .zoom-btn { background: var(--parchment); border: 1px solid var(--gold); color: var(--ink); padding: 10px 20px; cursor: pointer; transition: 0.3s; }
        .zoom-btn:hover { background: var(--gold-light); color: var(--warm-white); }

        footer { background: var(--ink); color: rgba(248,244,238,0.3); text-align: center; padding: 40px; font-size: 0.75rem; }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="../index.html" class="nav-logo">ARCHIWUM L&K</a>
    </div>
</nav>

<main>
    <section class="intro-section">
        <span class="s-label">Księgi i Rodowody</span>
        <h1>Drzewo Klanowe</h1>
        <div class="s-line"></div>
    </section>

    <div class="control-bar">
        <button class="zoom-btn" onclick="resetZoom()">RESET WIDOKU</button>
    </div>

    <div class="tree-viewport" id="treeViewport">
        <div class="css-tree" id="tree-render-area">
            <div class="loader">Wczytywanie...</div>
        </div>
    </div>
</main>

<footer>
    <p>KLAN ŁADOMIRSKICH I KRAIŃSKICH © 1975 – 2026</p>
</footer>

<script>
    function generateNodeHTML(person) {
        let html = `<li><div class="node ${person.isRoot ? 'root-node' : ''}">`;
        html += `<strong>${person.name}</strong>`;
        if (person.dates) html += `<span class="dates">${person.dates}</span>`;
        if (person.marriage) html += `<span class="marriage"><span class="m-icon">⚭</span>${person.marriage}</span>`;
        html += `</div>`;
        if (person.children && person.children.length > 0) {
            html += `<ul>`;
            person.children.forEach(child => html += generateNodeHTML(child));
            html += `</ul>`;
        }
        html += `</li>`;
        return html;
    }

    async function loadTreeData() {
        const renderArea = document.getElementById('tree-render-area');
        try {
            const response = await fetch('drzewo.json?t=' + Date.now());
            if (!response.ok) throw new Error('Błąd HTTP: ' + response.status);
            
            const data = await response.json();
            const rootData = Array.isArray(data) ? data[0] : data;
            
            renderArea.innerHTML = `<ul>${generateNodeHTML(rootData)}</ul>`;
        } catch (error) {
            console.error("Błąd:", error);
            renderArea.innerHTML = `<p style="padding: 20px; color: red;">Błąd wczytywania drzewa.</p>`;
        }
    }

    function resetZoom() {
        const viewport = document.getElementById('treeViewport');
        viewport.scrollLeft = 0;
        viewport.scrollTop = 0;
    }

    window.addEventListener('load', loadTreeData);
</script>

</body>
</html>
