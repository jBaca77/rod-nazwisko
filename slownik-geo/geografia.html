<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografia Rodowa | Archiwum L&K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6; 
    --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548; 
    --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a; 
    --gold-light: #c8a96e; --green-dark: #2c3e2d; --line: rgba(122, 101, 72, 0.2); 
    --hex1a: #C9D980; --hex1b: #F2F24E; --hex2a: #A8E653; --hex2b: #F9F955; 
    --hex3a: #66F94E; --hex3b: #F9F955; --hex4a: #F9F955; --hex4b: #F29079; 
    --hex5a: #F9D0D7; --hex5b: #F29079; --hex6a: #F29079; --hex6b: #70E1F5; 
    --hex7a: #EE2B1D; --hex7b: #F29079; 
  } 

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } 
  body { font-family: 'Jost', sans-serif; background-color: var(--warm-white); color: var(--ink); line-height: 1.6; } 

  header { background-color: var(--green-dark); color: var(--cream); text-align: center; padding: 80px 24px; position: relative; } 
  .header-ornament { font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: .3em; color: var(--gold-light); margin-bottom: 15px; display: block; text-transform: uppercase; } 
  header h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 10px; } 
  header h1 em { font-style: italic; color: var(--gold-light); } 
  .header-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: rgba(248,244,238,.7); max-width: 600px; margin: 0 auto; } 

  main { max-width: 1100px; margin: 0 auto; padding: 50px 24px; } 
  .s-label { font-size: .7rem; letter-spacing: .4em; text-transform: uppercase; color: var(--sepia-light); margin-bottom: 12px; display: block; text-align: center; } 
  .s-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; margin-bottom: 30px; color: var(--ink); text-align: center; } 

  .map-layout { display: flex; gap: 30px; align-items: flex-start; }
  .map-column { flex: 2; }
  .sidebar-column { flex: 1; height: 600px; overflow-y: auto; background: var(--parchment); border: 1px solid var(--sepia-pale); padding: 10px; }
  .sidebar-column::-webkit-scrollbar { width: 4px; }
  .sidebar-column::-webkit-scrollbar-thumb { background: var(--sepia); }

  #map { height: 550px; width: 100%; border: 1px solid var(--sepia-pale); margin-bottom: 20px; filter: sepia(10%); } 

  .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; } 
  .filter-item { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 15px; border: 1px solid var(--sepia-pale); background: var(--cream); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; } 
  .filter-item.active { background: var(--ink); color: var(--gold-light); border-color: var(--ink); } 

  .geo-box { background: #fff; border: 1px solid var(--sepia-pale); padding: 12px; position: relative; margin-bottom: 8px; display: flex; flex-direction: column; gap: 2px; } 
  .ribbon { position: absolute; top: 0; right: 10px; width: 12px; height: 24px; background: linear-gradient(90deg, var(--c1) 50%, var(--c2) 50%); z-index: 2; } 
  .ribbon::after { content: ''; position: absolute; bottom: 0; left: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 4px solid #fff; } 
  
  .box-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1rem; color: var(--ink); padding-right: 20px; } 
  .box-rod { font-size: 0.65rem; color: var(--sepia); text-transform: uppercase; letter-spacing: 1px; } 
  .btn-locate { font-size: 0.6rem; color: var(--sepia); cursor: pointer; text-transform: uppercase; font-weight: 600; } 
  .btn-locate:hover { color: var(--gold); text-decoration: underline; }

  @media (max-width: 900px) { .map-layout { flex-direction: column; } .sidebar-column { height: 400px; } }
</style> 
</head> 
<body> 

<header> 
    <span class="header-ornament">Szlakiem Naszych Przodków</span> 
    <h1>Geografia <em>Rodowa</em></h1> 
    <p class="header-quote">„Miejsca, w których żyli nasi ojcowie, niosą w sobie pamięć...”</p> 
</header> 

<main> 
  <h2 class="s-title">Mapa Siedlisk i Majątków</h2> 
  <div class="map-layout">
    <div class="map-column">
      <div id="map"></div> 
      <div class="filter-bar" id="filterBar"></div> 
    </div>
    <div class="sidebar-column">
      <div id="geoGrid"></div> 
    </div>
  </div>
</main> 

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
<script> 
  const locations = [
    { id: 1, n: "Biejków", rod: "Ładomirscy", cat: "c1", c: [51.69, 21.00], c1: "#C9D980", c2: "#F2F24E" },
    { id: 2, n: "Brzozowa", rod: "Ładomirscy", cat: "c1", c: [50.96, 21.66], c1: "#C9D980", c2: "#F2F24E" },
    { id: 18, n: "Lwów", rod: "Kraińscy", cat: "c2", c: [49.84, 24.03], c1: "#A8E653", c2: "#F9F955" },
    { id: 22, n: "Bierówka", rod: "Rod", cat: "c3", c: [49.77, 21.57], c1: "#66F94E", c2: "#F9F955" },
    { id: 38, n: "Babin", rod: "Rod", cat: "c4", c: [49.05, 24.50], c1: "#F9F955", c2: "#F29079" },
    { id: 57, n: "Biletówka", rod: "Rod", cat: "c5", c: [49.30, 26.06], c1: "#F9D0D7", c2: "#F29079" },
    { id: 66, n: "Bażanówka", rod: "Rod", cat: "c6", c: [49.60, 22.05], c1: "#F29079", c2: "#70E1F5" },
    { id: 87, n: "Chorzelów", rod: "Rod", cat: "c7", c: [50.32, 21.44], c1: "#EE2B1D", c2: "#F29079" }
  ];

  const map = L.map('map', { center: [52.0, 19.0], zoom: 6 }); 
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map); 

  const markerMap = {}; 
  const grid = document.getElementById('geoGrid'); 

  function init() { 
    locations.forEach(loc => { 
      const marker = L.circleMarker(loc.c, { radius: 6, fillColor: loc.c1, color: "#fff", weight: 2, fillOpacity: 0.9 }).addTo(map).bindPopup(`<strong>${loc.n}</strong>`); 
      marker.category = loc.cat; 
      markerMap[loc.id] = marker; 

      grid.innerHTML += ` 
        <div class="geo-box" data-cat="${loc.cat}"> 
          <div class="ribbon" style="--c1: ${loc.c1}; --c2: ${loc.c2};"></div> 
          <div class="box-title">${loc.n}</div> 
          <div class="box-rod">${loc.rod}</div>
          <span class="btn-locate" onclick="highlightMarker(${loc.id})">Namierz na mapie</span> 
        </div>`; 
    }); 
  } 

  function highlightMarker(id) { 
    const m = markerMap[id]; 
    map.flyTo(m.getLatLng(), 10, { duration: 1.5 }); 
    m.openPopup(); 
  } 

  init(); 
</script> 
</body> 
</html>
