<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --cream: #f8f4ee; --parchment: #ede8df; --warm-white: #fdfaf6;
    --ink: #1e1a14; --ink-light: #3d3628; --sepia: #7a6548;
    --sepia-light: #b09a7e; --sepia-pale: #e8ddd0; --gold: #9b7d4a;
    --gold-light: #c8a96e; --green-dark: #2c3e2d; --line: rgba(122, 101, 72, 0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background-color: var(--warm-white); color: var(--ink); line-height: 1.7; overflow-x: hidden; }
  header { background-color: var(--green-dark); color: var(--cream); text-align: center; padding: 100px 24px; }
  header h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 3.5rem; }
  main { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
  #map { height: 500px; width: 100%; border: 1px solid var(--sepia-pale); margin-bottom: 30px; }
  .filter-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 16px; border: 1px solid var(--sepia-pale); background: var(--cream); cursor: pointer; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; transition: 0.3s; }
  .filter-btn:hover { border-color: var(--gold); }
  .filter-btn.active { background: var(--ink); color: var(--gold-light); }
  .geo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
  .geo-box { background: var(--cream); padding: 15px; border-left: 5px solid var(--gold); border: 1px solid var(--sepia-pale); cursor: pointer; transition: 0.3s; }
  .geo-box:hover { border-color: var(--gold); background: #fff; transform: translateY(-3px); }
  .box-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.1rem; }
  @media (max-width: 900px) { #map { height: 300px; } }
</style>

  const map = L.map('map').setView([50.0, 22.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  const grid = document.getElementById('geoGrid');
  const filterBar = document.getElementById('filterBar');

  Object.keys(categoryStyles).forEach(cat => {
    filterBar.innerHTML += `<button class="filter-btn" onclick="render('${cat}')">${cat}</button>`;
  });

  function render(cat = 'all') {
    grid.innerHTML = '';
    map.eachLayer((layer) => { if (layer instanceof L.CircleMarker) map.removeLayer(layer); });
    
    const filtered = cat === 'all' ? locations : locations.filter(l => l.cat === cat);
    
    filtered.forEach(loc => {
      const color = categoryStyles[loc.cat];
      L.circleMarker(loc.c, { 
        radius: 8, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9 
      }).addTo(map).bindPopup(loc.n);
      
      grid.innerHTML += `<div class="geo-box" style="border-left-color:${color}" onclick="map.setView([${loc.c[0]}, ${loc.c[1]}], 10)">
          <div class="box-title">${loc.n}</div>
          <small>${loc.cat}</small>
      </div>`;
    });
  }

  render();

</html>
