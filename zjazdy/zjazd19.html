        body { font-family: 'Jost', sans-serif; background-color: var(--warm-white); color: var(--ink); line-height: 1.8; }
        
        nav { background-color: var(--ink); padding: 16px 24px; position: sticky; top: 0; z-index: 1000; }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: 'Cormorant Garamond', serif; color: var(--gold-light); text-decoration: none; font-size: 1.2rem; letter-spacing: 2px; }
        .back-link { color: var(--cream); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; }
        
        .article-header { max-width: 900px; margin: 60px auto 40px; padding: 0 24px; text-align: center; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 400; margin-bottom: 10px; }
        
        .info-panel { max-width: 850px; margin: 0 auto 50px; padding: 30px; background: var(--parchment); border-radius: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .info-item { font-size: 0.9rem; }
        .info-item strong { display: block; text-transform: uppercase; letter-spacing: 1px; color: var(--sepia); font-size: 0.75rem; }

        .hero-container { max-width: 1100px; margin: 0 auto 60px; padding: 0 24px; }
        .interactive-frame { border: 1px solid var(--line); padding: 10px; background: white; position: relative; border-radius: 4px; overflow: hidden; }
        .img-container { position: relative; width: 100%; cursor: crosshair; }
        .main-img { width: 100%; height: auto; display: block; }
        
        .hotspot { position: absolute; background: rgba(255, 0, 0, 0.2); border: 1px solid red; border-radius: 50%; cursor: pointer; z-index: 10; transform: translate(-50%, -50%); transition: 0.2s; }
        .hotspot:hover, .hotspot.active { background: rgba(255, 255, 255, 0.5); border: 2px solid var(--gold); box-shadow: 0 0 10px var(--gold); }
        .person-info-display { margin-top: 20px; background: var(--parchment); border-left: 3px solid var(--gold); padding: 20px; text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; }

        .memories-section { max-width: 800px; margin: 60px auto; padding: 0 24px; }
        .memory-card { border-left: 3px solid var(--gold); padding: 10px 0 10px 30px; margin-bottom: 30px; font-style: italic; }
        
        .gallery-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .simple-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .gallery-item { overflow: hidden; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .gallery-item:hover img { transform: scale(1.05); }

        #lightbox { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        #lb-img { max-width: 90%; max-height: 80vh; border: 5px solid white; }

    // 1. Logika Hotspotów
    const container = document.getElementById('hotspot-container');
    const mainImg = document.getElementById('main-group-img');
    const infoDisplay = document.getElementById('person-info');
    const panzoom = Panzoom(container, { maxScale: 5, contain: 'outside' });
    container.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);

    mainImg.onload = () => {
        daneJSON.features.forEach(feat => {
            const hotspot = document.createElement('div');
            hotspot.className = 'hotspot';
            const cx = feat.geometry.coordinates[0][0][0]; 
            const cy = -feat.geometry.coordinates[0][0][1]; 
            hotspot.style.left = (cx / mainImg.naturalWidth * 100) + '%';
            hotspot.style.top = (cy / mainImg.naturalHeight * 100) + '%';
            hotspot.style.width = '2.5%'; hotspot.style.height = '2.5%';
            hotspot.onclick = () => {
                document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
                hotspot.classList.add('active');
                infoDisplay.innerHTML = feat.properties.dane;
            };
            container.appendChild(hotspot);
        });
    };

    // 2. Logika Galerii
    const gallery = document.getElementById('gallery-container');
    for (let i = 1; i <= 172; i++) {
        const nr = i.toString().padStart(2, '0');
        const img = document.createElement('div');
        img.className = 'gallery-item';
        img.innerHTML = `<img src="../img/zjazdy/zjazdxix/foto_zjazdxix_${nr}.jpg">`;
        img.onclick = () => { document.getElementById('lb-img').src = img.querySelector('img').src; document.getElementById('lightbox').style.display = 'flex'; };
        gallery.appendChild(img);
    }
    function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }
